**Code for the user interface**
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Attendance System - Face Recognition</title>
  <!-- Bootstrap CSS for professional styling -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f7f7f7;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      margin-top: 30px;
    }
    .card {
      max-width: 500px;
      margin: 30px auto;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }
    .card-header {
      background-color: #007bff;
      color: #fff;
      text-align: center;
    }
    .video-container {
      border: 2px solid #007bff;
      border-radius: 8px;
      overflow: hidden;
      width: 100%;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
    }
    #label {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      color: #28a745;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h3>Face Recognition Attendance</h3>
      </div>
      <div class="card-body">
        <div class="video-container">
          <video id="video" autoplay></video>
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
        <div id="label" class="mt-3 text-center">Loading...</div>
      </div>
      <div class="card-footer text-center">
        <small>&copy; 2025 Attendance System</small>
      </div>
    </div>
  </div>

  <!-- Bootstrap & jQuery Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const label = document.getElementById("label");

    // Request access to webcam
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
          video.srcObject = stream;
      })
      .catch(err => {
          label.innerText = "Camera access denied!";
          console.error("Camera error:", err);
      });

    // Capture and send frame every 3 seconds for processing
    setInterval(() => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = canvas.toDataURL("image/jpeg");

      fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: imageData })
      })
      .then(res => res.json())
      .then(data => {
        if(data.label) {
          label.innerText = "Welcome, " + data.label + "!";
        } else {
          label.innerText = "Face not recognized";
        }
      })
      .catch(err => {
        label.innerText = "Error: " + err.message;
        console.error("Fetch error:", err);
      });
    }, 3000);
  </script>
</body>
</html>
